[package]
name = "dance"
description = "Deploy NixOS hosts from a local inventory"
license = "MIT OR Apache-2.0"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
dialoguer = { version = "0.12", default-features = false }
display_full_error = "1"
dirs = "6"
futures = { version = "0.3", default-features = false, features = ["async-await", "std"] }
indicatif = { version = "0.18", default-features = false, features = ["unicode-width"] }
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tabled = "0.21"
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "signal", "time"] }
tokio-process-tools = "0.11.2"
tokio-util = { version = "0.7", features = ["rt"] }
toml = { version = "0.9", features = ["preserve_order"] }
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
tempfile = "3"
