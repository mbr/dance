[package]
name = "dance-ops"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
authors = ["Marc Brinkmann <git@marcbrinkmann.de>"]
description = "Deploy NixOS hosts safely from a local inventory"
documentation = "https://docs.rs/dance-ops"
homepage = "https://github.com/mbr/dance"
repository = "https://github.com/mbr/dance"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["nixos", "deployment", "ssh", "operations"]
categories = ["command-line-utilities"]

[[bin]]
name = "dance"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
dialoguer = { version = "0.12", default-features = false }
display_full_error = "1"
dirs = "6"
futures = { version = "0.3", default-features = false, features = ["async-await", "std"] }
indicatif = { version = "0.18", default-features = false, features = ["unicode-width"] }
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tabled = "0.21"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "time"] }
tokio-process-tools = "0.11.2"
tokio-util = { version = "0.7", features = ["rt"] }
toml = { version = "0.9", features = ["preserve_order"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
tempfile = "3"
